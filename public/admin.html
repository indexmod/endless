<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8"/>

<title>Endless — Paste</title>

<meta
	name="viewport"
	content="width=device-width, initial-scale=1.0"
/>

<link
	rel="stylesheet"
	href="./admin.css"
/>

</head>

<body>

<div class="panel">

	<input
		id="img"
		type="url"
		placeholder="Paste URL — image or map"
		autocomplete="off"
	/>

	<textarea
		id="text"
		placeholder="Write anything..."
	></textarea>

	<div id="counter">
		0
	</div>

	<button id="sendBtn">
		Send
	</button>

</div>


<div id="lastPost"></div>


<a
	href="./index.html"
	class="endlessBtn"
>
	Endless
</a>


<script
	src="./admin.js"
	defer
></script>

</body>
</html>
